<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Alchemist's Workshop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Magical Alchemist's Workshop</h1>

    <div id="resources">
        <h2>Resources</h2>
        <p>Mana Shards: <span id="mana-shards-count">0</span></p>
        <p>Glimmer: <span id="glimmer-count">0</span></p>
    </div>

    <div id="actions">
        <h2>Actions</h2>
        <button id="gather-mana-shards">Gather Mana Shard</button>
        <button id="build-mana-condenser">Build Mana Condenser (Cost: 10 Mana Shards)</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
